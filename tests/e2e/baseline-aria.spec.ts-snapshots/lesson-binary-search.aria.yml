    - heading "How linear search compares" [level=3]
    - paragraph:
      - text: Linear search needs none of this bookkeeping. There is no
      - code: lo
      - text: ","
      - code: hi
      - text: ", or"
      - code: mid
      - text: ", and no sorted precondition — just a single index walking from"
      - code: "0"
      - text: "to the end, comparing each value with the target and stopping at the first match. The contrast is the whole point: where binary search"
      - strong: discards half
      - text: the remaining items per comparison, linear search
      - strong: eliminates one
      - text: . On the sorted array
      - code: /\[1, 3, 5, 7, 9, \d+\]/
      - text: ", finding"
      - code: /\d+/
      - text: takes linear search six comparisons but binary search only three.
    - paragraph:
      - text: Here it is on an
      - strong: unsorted
      - text: array, so you can see it march through every cell in turn. The lifted cell marked
      - strong: curr
      - text: is the one being checked; cells to its left are already rejected. Notice there is no window to halve — it simply advances one index at a time until it finds the target or reaches the end.
    - region "Linear search through an array visualization":
