    - heading "Complexity" [level=2]
    - table "Time and space complexity":
      - caption: Time and space complexity
      - rowgroup:
        - row "Measure Best Average Worst":
          - columnheader "Measure"
          - columnheader "Best"
          - columnheader "Average"
          - columnheader "Worst"
      - rowgroup:
        - row "Time O(1) O(log n) O(log n)":
          - rowheader "Time"
          - cell "O(1)"
          - cell "O(log n)"
          - cell "O(log n)"
        - row "Space — — O(1)":
