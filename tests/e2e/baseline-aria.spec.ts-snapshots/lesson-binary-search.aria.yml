    - heading "Code" [level=2]
    - heading "Binary search" [level=3]
    - paragraph: The same algorithm in three languages. Notice how closely each mirrors the steps above — and how the structure matches the trace you stepped through in the visualizer.
    - tablist "Code language":
      - tab "Python" [selected]
      - tab "JavaScript"
      - tab "Java"
    - tabpanel "Python":
      - button "Copy Python code"
      - code: "def binary_search(arr, target): lo, hi = 0, len(arr) - 1 while lo <= hi: mid = (lo + hi) // 2 if arr[mid] == target: return mid # found it if arr[mid] < target: lo = mid + 1 # search the right half else: hi = mid - 1 # search the left half return -1 # not in the array"
    - status
    - heading "Linear search" [level=3]
    - paragraph: For comparison, the naive scan — a single loop with no sorted precondition and no halving.
    - tablist "Code language":
