          - cell "—"
          - cell "—"
          - cell "O(1)"
    - paragraph:
      - text: The table above is for
      - strong: binary search
      - text: . Every comparison throws away half of the remaining items, so the number of checks grows with the
      - strong: logarithm
      - text: of the array size — doubling the input adds just one more step. That is the
      - code: O(log n)
      - text: worst and average case. The best case is
      - code: O(1)
      - text: ": the very first middle you check happens to be the target. Only a couple of index variables are needed, so the extra space is"
      - code: O(1)
      - text: .
    - paragraph:
      - strong: Linear search
      - text: "is the opposite trade:"
      - code: O(n)
      - text: time in the average and worst cases (it may inspect every element),
      - code: O(1)
      - text: best case (the target is first), and
      - code: O(1)
      - text: space. Sorting an array first costs
      - code: O(n log n)
      - text: ", so a single search is not worth sorting for — but if you will search the same array many times, sorting once and using binary search repeatedly wins big."
    - heading "Code" [level=2]
    - heading "Binary search" [level=3]
    - paragraph: The same algorithm in three languages. Notice how closely each mirrors the steps above — and how the structure matches the trace you stepped through in the visualizer.
    - tablist "Code language":
      - tab "Python" [selected]
      - tab "JavaScript"
      - tab "Java"
    - tabpanel "Python":
      - button "Copy Python code"
      - code: "def binary_search(arr, target): lo, hi = 0, len(arr) - 1 while lo <= hi: mid = (lo + hi) // 2 if arr[mid] == target: return mid # found it if arr[mid] < target: lo = mid + 1 # search the right half else: hi = mid - 1 # search the left half return -1 # not in the array"
    - status
    - heading "Linear search" [level=3]
    - paragraph: For comparison, the naive scan — a single loop with no sorted precondition and no halving.
    - tablist "Code language":
