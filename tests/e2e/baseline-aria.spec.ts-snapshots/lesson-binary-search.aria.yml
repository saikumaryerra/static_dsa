        - listitem: Linear & Binary Search
    - heading "Linear & Binary Search" [level=1]
    - paragraph: "Find an element in an array two ways: linear search scans every item in O(n); binary search halves a sorted range in O(log n)."
    - text: /Beginner \d+ min lesson 7 min read Builds on:/
    - list "Builds on:":
      - listitem:
        - link "Complexity & Big-O":
          - /url: /learn/complexity-big-o
      - listitem:
        - link "Arrays":
          - /url: /learn/arrays
    - group: On this page How it works
    - separator
    - heading "Intuition" [level=2]
    - paragraph: "Think about looking up a word in a paper dictionary. You do not start at page one and read every entry. You flip to the middle, glance at the word there, and decide: is my word before this page or after it? That one glance lets you throw away half the dictionary. Flip to the middle of what is left, decide again, and throw away half of that. In a few flips you have gone from thousands of pages to the single one you need."
    - paragraph:
      - strong:
        - link "Binary search":
          - /url: /glossary#binary-search
      - text: is exactly that idea for a
      - strong: sorted
      - text: "list. Because the values are in order, checking the middle one tells you which half your target could be in — so you can discard the other half every single time. Halving again and again is astonishingly fast: a sorted list of a million items is found in about twenty checks."
    - paragraph:
      - text: "The one rule you must not forget: the list has to be"
      - strong: sorted first
      - text: . Without order, the middle value tells you nothing about which side to keep, and the whole trick falls apart.
    - 'heading "The baseline: linear search" [level=3]'
    - paragraph:
      - text: "Before binary search, there is the obvious way to find something: start at the first item and check each one in turn until you hit the target or run out of items. That is"
      - strong:
        - link "linear search":
          - /url: /glossary#linear-search
      - text: . It is dead simple and it works on
      - strong: any
      - text: "array — sorted or not — but it has no shortcut: in the worst case it inspects every element, so searching a million items can take a million comparisons. Binary search exists precisely to beat that steady one-at-a-time march, and the price of admission is that the data must already be sorted. Keep both in mind as you read on: linear search trades speed for zero requirements; binary search demands order and repays you with logarithmic speed."
    - heading "How it works" [level=2]
    - paragraph:
      - text: "Keep track of the slice of the array you are still searching with two markers:"
      - strong:
        - code: lo
      - text: (the first index that might hold the target) and
      - strong:
        - code: hi
      - text: (the last index that might). At the start, that slice is the whole array, so
      - code: lo
      - text: is
      - code: "0"
      - text: and
      - code: hi
      - text: is the last index.
    - paragraph: "Each round does three things:"
    - list:
      - listitem:
        - text: Look at the
        - strong: middle
        - text: index,
        - code: mid = (lo + hi) / 2
        - text: (rounded down).
      - listitem:
        - text: Compare
        - code: arr[mid]
        - text: "with the target:"
        - list:
          - listitem:
            - text: If they are
            - strong: equal
            - text: ", you are done — the target is at"
            - code: mid
            - text: .
          - listitem:
            - text: If
            - code: arr[mid]
            - text: is
            - strong: less than
            - text: the target, the target can only be to the right, so move
            - code: lo
            - text: to
            - code: mid + 1
            - text: and discard the left half.
          - listitem:
            - text: If
            - code: arr[mid]
            - text: is
            - strong: greater than
            - text: the target, discard the right half by moving
            - code: hi
            - text: to
            - code: mid - 1
            - text: .
      - listitem: Repeat with the smaller slice.
    - paragraph:
      - text: If the slice ever becomes empty —
      - code: lo
      - text: passes
      - code: hi
      - text: — there is nowhere left to look, so the target is not in the array.
    - paragraph:
      - text: "The run alongside makes the shrinking window concrete: watch"
      - code: lo
      - text: and
      - code: hi
      - text: close in on the answer, and see which half gets discarded after every comparison.
    - paragraph:
      - text: Press
      - strong: Play
      - text: to run it automatically, or
      - strong: Step forward
      - text: to move one comparison at a time. The highlighted band is the current search window; the lifted cell marked
      - strong: mid
      - text: "is the value being checked. The same run is written out under the drawing, one row per step:"
      - link "step 2 in the run written out below":
        - /url: "#viz-binary-search-8phqkb-row-2"
      - text: is the comparison that throws away half the array, and
      - link "the last row — step 4 in the run written out below":
        - /url: "#viz-binary-search-8phqkb-row-4"
      - text: is where the search ends. Try your own sorted array and target to see how few steps it really takes.
