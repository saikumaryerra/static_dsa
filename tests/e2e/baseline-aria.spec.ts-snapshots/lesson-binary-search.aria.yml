    - heading "Complexity" [level=2]
    - paragraph:
      - text: The table alongside is for
      - strong: binary search
      - text: . Every comparison throws away half of the remaining items, so the number of checks grows with the
      - strong: logarithm
      - text: of the array size — doubling the input adds just one more step. That is the
      - code: O(log n)
      - text: worst and average case. The best case is
      - code: O(1)
      - text: ": the very first middle you check happens to be the target. Only a couple of index variables are needed, so the extra space is"
      - code: O(1)
      - text: .
    - paragraph:
      - strong: Linear search
      - text: "is the opposite trade:"
      - code: O(n)
      - text: time in the average and worst cases (it may inspect every element),
      - code: O(1)
      - text: best case (the target is first), and
      - code: O(1)
      - text: space. Sorting an array first costs
      - code: O(n log n)
      - text: ", so a single search is not worth sorting for — but if you will search the same array many times, sorting once and using binary search repeatedly wins big."
