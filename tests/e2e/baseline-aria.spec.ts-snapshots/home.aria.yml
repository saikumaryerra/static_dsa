- main:
  - heading "See how the machine actually works" [level=1]
  - paragraph: "3 free courses — data structures and algorithms, Kubernetes, and system design. The algorithms run in your browser, one step at a time, on your own input. The rest is taught the same way: one idea per lesson, with a real manifest, a worked estimate or a diagram you can read."
