    - paragraph: /1 lesson · ~\d+ min · All beginner/
    - list:
      - listitem:
        - link "The design workflow 1 lesson":
          - /url: ./learn/system-design/#track-sd-foundations
  - region "What it costs you":
    - heading "What it costs you" [level=2]
    - term: No account, no paywall
    - definition: Every lesson is open on the first visit. There is nothing to sign up for, because there is no server to sign up to.
    - term: No tracking, no cookies
    - definition: Nothing is measured and nothing is sent anywhere. The site makes no network calls at all once a page has loaded.
    - term: Progress stays on this device
    - definition: What you finish is remembered in this browser only — never synced, never uploaded. Clearing your browser data clears it.
    - term: Works offline, and without JavaScript
    - definition: A loaded lesson keeps working with no connection. With scripts blocked the prose, the code and the written-out run are all still there.
  - heading "Start where the rest of it builds from." [level=2]
  - 'link /Begin: \d+ · Complexity & Big-O/':
