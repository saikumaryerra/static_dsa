  - paragraph:
    - text: The real lesson visualization, running here.
    - link "Open the lesson":
      - /url: ./learn/binary-search/
  - region "What an algorithms lesson actually does":
    - heading "What an algorithms lesson actually does" [level=2]
    - heading "Step it, forwards and back" [level=3]
    - paragraph: The drawing above is not an animation. An instrumented algorithm ran once and recorded every step, so the player is just an index into that record — which is why stepping backwards is instant, and why it is always the truth.
    - heading "Read the same run as a table" [level=3]
    - paragraph: "Under every drawing is the run written out, one row per step, with the algorithm’s own variables as columns. Two views of one trace: they cannot tell you different stories, and with JavaScript off the table is the lesson."
    - heading "Run it on your own numbers" [level=3]
    - paragraph: Type an array and press Run. The algorithm executes on your input for real and the drawing, the table and the step count all follow — no canned second example, nothing pre-recorded.
  - region /\d+ lessons, 3 courses/:
    - heading /\d+ lessons, 3 courses/ [level=2]
    - paragraph: "Work through a course in order, or start at whichever topic you came for — nothing is locked, and every lesson names what it builds on. Kubernetes and System Design are prose and diagrams rather than instruments: one idea per lesson, each with something you could actually apply, run or estimate."
    - heading "Data Structures & Algorithms" [level=3]:
      - link "Data Structures & Algorithms":
        - /url: ./learn/dsa/
    - paragraph: /\d+ lessons · ~\d+ min · \d+ beginner · 2 intermediate/
    - list:
