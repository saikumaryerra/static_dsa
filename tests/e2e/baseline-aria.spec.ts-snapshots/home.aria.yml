- main:
  - heading "See data structures and algorithms in motion" [level=1]
  - paragraph: Fifteen lessons that teach the core of computer science by showing you the algorithm running. Every swap, pointer move and recursive call, one step at a time — on your own input, in your own browser.
  - link /Start with lesson \d+/:
    - /url: /learn/complexity-big-o
  - link /See all \d+ lessons/:
    - /url: /learn
  - region "Binary search on a sorted array visualization":
