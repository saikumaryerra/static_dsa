# Definition-of-Done gate (spec §18).
#
# Cloudflare Pages is connected directly to this GitHub repo and runs its own build
# (`npm run build`) on every push — but that only type-checks and builds. This
# workflow runs the checks Cloudflare does not: lint, format, unit, and the
# Playwright/axe e2e suite. Make `DoD gate` a required status check on `main`
# (Settings → Branches) so a red build can never reach the production branch.
#
# This workflow deliberately does NOT deploy — Cloudflare's git integration owns
# deployment. Adding a Wrangler deploy step here would publish twice.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Added FOR the `seed-visual-baselines` job below, which is the only job gated
  # on this event. Note what that does NOT mean: a manual dispatch also runs the
  # `DoD gate` job, which carries no event filter — deliberately, since the
  # seeding instructions say to seed from a commit whose gate is green, and this
  # is what proves it at seeding time.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run of the same ref. The event is part
  # of the key so a manual seeding run and a push to the same branch never cancel
  # each other — they do unrelated work and neither result substitutes for the
  # other. Push/PR grouping is unchanged (those events already carry distinct refs).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository. It deploys
# nothing, comments on nothing, and touches no releases, so the default token
# scopes (which a repository setting can widen to write) are narrowed here at the
# workflow rather than trusted to stay narrow. Artifact upload/download is
# unaffected — those actions authenticate with the runtime token, not this one.
permissions:
  contents: read

jobs:
  verify:
    name: DoD gate
    runs-on: ubuntu-latest
    # PINNED RENDERING ENVIRONMENT. The e2e suite compares committed pixel
    # baselines, and this site ships a pure system-font stack — so what a capture
    # looks like depends entirely on the fonts fontconfig finds. `ubuntu-latest`
    # is a moving target whose font packages change over time, which is what makes
    # unpinned pixel baselines unmaintainable: they rot without anyone touching
    # the site. Pinning the image to the same one the baselines were seeded in
    # makes the comparison meaningful AND locally reproducible — a contributor can
    # regenerate them with the identical command (see the seeding job below).
    # It also ships the browsers, so no `playwright install` step is needed.
    # Keep this tag, the seeding job's tag, and the @playwright/test version in
    # package.json in lockstep; a mismatch silently changes how text is drawn.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # A hung browser or a wedged preview server should fail in minutes, not burn
    # the 6-hour default. The full gate (install → build → lint → format → unit →
    # Playwright with retries) runs well inside this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth, shared with Cloudflare
          cache: npm

      - run: npm ci # lockfile-exact, reproducible

      - run: npm run build # astro check (type gate) + astro build

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test # Vitest unit suite

      # Browsers and system libs are already in the container (see `container:`
      # above), so there is no `playwright install` step here.

      - run: npm run test:e2e # Playwright smoke + axe a11y + pixel baselines
        env:
          # Step 2 of the visual-baseline flow. The PNGs in
          # tests/e2e/baseline-visual.spec.ts-snapshots/ are committed, so the 14
          # captures compare instead of skipping. This is only safe because the
          # job runs in the pinned container: the site uses a pure system-font
          # stack, so glyph rasterisation follows whatever fontconfig resolves,
          # and a bare ubuntu-latest runner does not render identically to the
          # image the baselines were made in.
          VISUAL_BASELINE: '1'

      # Keep the evidence on failure so a red run is diagnosable without a local
      # repro: the HTML report (CI-only reporter) plus test-results/, which holds
      # the `on-first-retry` traces, screenshots, and videos.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # M7.1 Task 0 — RE-seeding the pixel baseline after an intentional visual change.
  #
  # The baseline is live: the PNGs are committed and the `verify` job above
  # compares them on every run. Use this job when a change is *meant* to alter how
  # a page looks — re-seed, review the artifact, commit the new PNGs in the same
  # PR as the change that justified them. A diff nobody expected is the gate doing
  # its job; a diff everybody expected is a two-minute artifact review.
  #
  # WHY BOTH JOBS RUN IN A CONTAINER. The site ships a pure system-font stack, so
  # every glyph — and therefore every pixel — depends on the fonts fontconfig
  # resolves. A bare `ubuntu-latest` runner is a moving target: its font packages
  # change over time, so unpinned baselines rot without anyone touching the site.
  # Pinning both jobs to one image makes the comparison stable AND reproducible
  # off CI, which the earlier "this can only run here" note had assumed away.
  #
  # To reproduce or re-seed locally, run the same image (no Playwright install,
  # no font setup — it is the identical environment):
  #
  #   docker run --rm -v "$PWD":/work -w /work --user "$(id -u):$(id -g)" \
  #     mcr.microsoft.com/playwright:v1.61.1-noble \
  #     bash -c 'npm run build && CI=1 VISUAL_BASELINE=1 npx playwright test \
  #       tests/e2e/baseline-visual.spec.ts --update-snapshots'
  #
  # Drop `--update-snapshots` to COMPARE instead of rewrite. Note the flag is
  # still needed either way, and that `--update-snapshots` overrides
  # `updateSnapshots: 'none'` (which playwright.config.ts sets whenever CI is set)
  # — that config is what makes a MISSING baseline a failure in the gate rather
  # than a silent regeneration.
  seed-visual-baselines:
    name: Seed visual baselines
    # Never on push/PR: seeding is an explicit human act, not part of the gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # MUST stay byte-identical to the `verify` job's image, or the PNGs it
    # produces are useless: they would be compared against text drawn by a
    # different set of fonts.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20 # one spec file, not the whole suite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth, shared with Cloudflare
          cache: npm

      - run: npm ci

      # Playwright's webServer runs `npm run preview` on CI (it assumes the gate
      # already built), so dist/ must exist before the seeding run below.
      - run: npm run build

      # Browsers ship with the container; no `playwright install` needed.

      # Every capture in that file is gated on this flag; --update-snapshots
      # writes the PNGs into the snapshot dir uploaded below. No other spec runs
      # — a full e2e pass is the `verify` job's business.
      #
      # This step is expected to end GREEN, and all three of the things that make
      # it work were verified against the installed Playwright (1.61.1) rather
      # than assumed:
      #   - the CLI option beats the config, so `updateSnapshots: 'none'` (which
      #     `playwright.config.ts` sets whenever CI is set, as it is here) does
      #     not disarm the flag;
      #   - a bare `--update-snapshots` means `changed`, not `all`;
      #   - in `changed` mode a MISSING snapshot is written and the assertion
      #     passes, so a red run here means something genuinely broke.
      - run: VISUAL_BASELINE=1 npx playwright test tests/e2e/baseline-visual.spec.ts --update-snapshots

      # always(): a partial set still shows WHICH capture went wrong, and these
      # PNGs are reviewed before they are committed either way. `error` on empty,
      # because an artifact-less "success" is the one outcome that would waste
      # someone's afternoon.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/baseline-visual.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
