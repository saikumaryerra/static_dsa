<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rising bars: a nod to the sorting visualizations. Favicons cannot read CSS
       variables, so the light value of the brand token is repeated here as a
       literal. The achromatic repaint took it from indigo to #141519, where it
       is now byte-identical to the text token; the bars stay white, the brand
       contrast token, at 18.24:1 on the plate.

       CAUTION, and the reason no custom property is spelled out above: XML
       forbids a double hyphen inside a comment, and this file used to spell one
       token's full name here. That made it un-decodable as SVG in every browser
       (Chromium: "Double hyphen within comment"), so the whole time it shipped,
       every visitor silently fell back to the favicon-32.png declared before it.

       Regenerate the two PNG derivatives with `npm run icons` after any edit. -->
  <rect width="64" height="64" rx="14" fill="#141519" />
  <rect x="12" y="34" width="10" height="18" rx="2" fill="#FFFFFF" />
  <rect x="27" y="24" width="10" height="28" rx="2" fill="#FFFFFF" />
  <rect x="42" y="14" width="10" height="38" rx="2" fill="#FFFFFF" />
</svg>
